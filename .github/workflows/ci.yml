name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/rpc.test.cjs
      - run: CHROME="$(command -v google-chrome)" node test/browser-test.mjs

  # Pushing a tag vX.Y.Z publishes a release with the xpi and the update manifest that
  # installed copies poll through manifest.json's update_url.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches manifest.json
        run: |
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' manifest.json)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }
      - run: ./build.sh
      - run: gh release create "$GITHUB_REF_NAME" dist/zotero-ask-gpt.xpi dist/updates.json --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
