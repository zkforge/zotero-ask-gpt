<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chat</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <header>
    <div class="heading">
      <div id="title"></div>
      <div id="notice" role="status"><span class="dot" aria-hidden="true"></span><span id="notice-text"></span></div>
    </div>
    <button id="reset" class="icon" title="新对话" aria-label="新对话">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg>
    </button>
    <button id="close" class="icon" title="收起侧栏 (⌘⇧G)" aria-label="收起侧栏">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
    </button>
  </header>

  <main id="messages" aria-live="polite"></main>

  <footer>
    <div class="composer">
      <div id="quote" hidden>
        <div class="quote-head">
          <svg class="quote-mark" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5v9M6.5 5h6M6.5 8h6M6.5 11h4"/></svg>
          <span id="quote-page" class="label"></span>
          <button class="ghost" data-prompt="解释这段文字，说明其中的关键术语。">解释</button>
          <button class="ghost" data-prompt="把这段文字翻译成中文，保留术语原文。">翻译</button>
          <button id="quote-clear" class="icon small" title="移除引用" aria-label="移除引用">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 5l6 6M11 5l-6 6"/></svg>
          </button>
        </div>
        <div id="quote-body"></div>
      </div>
      <div id="image-card" class="image-list" hidden></div>
      <div id="capture-error" class="capture-error" hidden></div>
      <textarea id="input" rows="2" placeholder="问问这篇论文…" title="Enter 发送，Shift+Enter 换行"></textarea>
      <div class="bar">
        <button id="capture" class="icon tool" title="截图提问：在 PDF 上框选图表或公式" aria-label="截图提问">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5.5v-2a1 1 0 0 1 1-1h2M10.5 2.5h2a1 1 0 0 1 1 1v2M13.5 10.5v2a1 1 0 0 1-1 1h-2M5.5 13.5h-2a1 1 0 0 1-1-1v-2"/><circle cx="8" cy="8" r="2"/></svg>
        </button>
        <button id="model-button" class="picker-button" hidden aria-haspopup="menu" aria-expanded="false" title="模型"></button>
        <button id="effort-button" class="picker-button effort" hidden aria-haspopup="menu" aria-expanded="false" title="思考强度"></button>
        <button id="send" class="send" title="发送" aria-label="发送">
          <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.5 3.5v4.5a2 2 0 0 1-2 2H3.5"/><path d="M6.5 7 3.5 10l3 3"/></svg>
          <svg class="square" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.5" y="4.5" width="7" height="7" rx="1.5"/></svg>
        </button>
      </div>
      <div id="menu" class="menu-card" role="menu" hidden></div>
    </div>
  </footer>

  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="render.js"></script>
  <script src="chat.js"></script>
</body>
</html>
